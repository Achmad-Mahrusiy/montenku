# Supabase Free pauses a project after a week without activity. Once a day, call /api/health on the live site, which
# runs a tiny query (brief, Fase 0). Set the repository variable HEALTH_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://montenku.vercel.app/api/health. Until then the job is skipped.
# GitHub disables scheduled workflows in a public repo after 60 days without repository activity; re-enable it in
# the Actions tab if that happens (D-038).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/health (fails on anything but 2xx)
        run: curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 "$HEALTH_URL"
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
